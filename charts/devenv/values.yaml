# -- Override the chart name.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/tinyrack-net/devenv
  # -- Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# -- Replicas. Leader election is enabled automatically when > 1.
replicaCount: 1

environments:
  # -- Namespace where environments are created.
  namespace: devenv
  # -- Create the namespace (set false if you manage it yourself).
  createNamespace: true
  namespaceLabels: {}
  namespaceAnnotations: {}
  # -- Optional ResourceQuota for the environment namespace, e.g.
  # { requests.cpu: "16", requests.memory: 64Gi, requests.storage: 500Gi }
  quota: {}

# -- Public URL of the console, e.g. https://devenv.example.com. Required for
# OIDC (callback URL: <externalURL>/api/v1/auth/oidc/<id>/callback).
externalURL: ""

auth:
  # -- password or none (development only: everyone is the local admin).
  mode: password
  # -- Local administrator account. Keep it as a fallback even with OIDC, or
  # disable it with passwordLogin: false.
  adminUsername: admin
  passwordLogin: true
  # -- Existing Secret with key `password`. When empty a random password is
  # generated and kept across upgrades.
  existingSecret: ""
  # -- User names or e-mail addresses that are always administrators.
  admins: []
  # -- Session lifetime.
  sessionTTL: 168h
  # -- OIDC providers. The client secret comes from an existing Secret
  # (key `client-secret` unless secretKey is set). Example:
  # - id: example
  #   name: Example SSO
  #   issuer: https://sso.example.com
  #   clientID: devenv
  #   existingSecret: devenv-oidc
  #   secretKey: client-secret
  #   scopes: [openid, profile, email, groups]
  #   claims: {username: preferred_username, groups: groups}
  #   autoCreate: true
  #   allowedGroups: []
  #   allowedEmails: []        # "*@example.com" matches a domain
  #   adminGroups: []
  oidc: []

# -- Per-user limits. Empty fields are unlimited; admins are unlimited unless
# adminLimits is set. Admins can override limits per user in the console.
users:
  defaultLimits: {}
  #  maxEnvironments: 5
  #  maxRunning: 3
  #  cpu: "8"
  #  memory: 32Gi
  #  disk: 200Gi
  adminLimits: null

# -- Daily export of users, environments, images, class access lists and the
# Secrets that must survive (server keys, environment host keys and
# passwords, access tokens). Home volumes are backed up by the storage system:
# add its selection labels to classes (spec.storage.labels). See
# docs/disaster-recovery.md.
backup:
  enabled: false
  schedule: "15 3 * * *"
  # -- file:///path (inside the job pod, e.g. a mounted volume) or
  # s3://bucket/prefix.
  dest: ""
  # -- Number of backups to keep.
  keep: 14
  s3:
    # -- S3 endpoint, e.g. https://s3.example.com (empty: AWS).
    endpoint: ""
    region: ""
    # -- Secret with the access key pair.
    existingSecret: ""
    accessKeyIDKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

# -- Extra configuration merged into the generated devenv.yaml (see
# docs/configuration.md). Values set here win.
config: {}

# -- Create a default DevEnvironmentClass. Every environment without an
# explicit class uses the class named "default".
defaultClass:
  create: true
  spec:
    storage:
      mode: persistent
      # storageClassName: ""   # empty = cluster default
      defaultSize: 10Gi
    network:
      mode: gateway
    limits:
      maxCPU: "8"
      maxMemory: 16Gi
      maxDisk: 100Gi

# -- Built-in image catalog entries. Tags default to the chart appVersion.
defaultImages:
  create: true
  # -- prepull keeps an image on every node (DaemonSet with an image volume)
  # so new environments start without pulling it.
  base:
    enabled: true
    repository: ghcr.io/tinyrack-net/devenv-base
    tag: ""
    prepull: true
  desktop:
    enabled: true
    repository: ghcr.io/tinyrack-net/devenv-desktop
    tag: ""
    prepull: false
  # -- Base image plus Go, Node.js (pnpm/yarn), uv and gh. Good default for AI agents.
  agent:
    enabled: true
    repository: ghcr.io/tinyrack-net/devenv-agent
    tag: ""
    prepull: true

# -- Extra DevEnvironmentClass objects: name -> spec.
extraClasses: {}
# -- Extra DevImage objects: name -> spec.
extraImages: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}
  labels: {}

# -- SSH gateway service (ssh -p <port> <env>@<host>).
sshService:
  enabled: true
  # -- Host users connect to, shown in the console. Empty = console host.
  publicHost: ""
  # -- Port users connect to. Defaults to `port` (or nodePort for NodePort).
  publicPort: null
  type: ClusterIP
  port: 2222
  # -- Fixed nodePort when type is NodePort.
  nodePort: null
  loadBalancerClass: ""
  # -- Local preserves client source IPs (LoadBalancer/NodePort only).
  externalTrafficPolicy: ""
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: devenv.example.com
  tls: []
  #  - secretName: devenv-tls
  #    hosts: [devenv.example.com]

httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []

# -- Mount the devenv-agent helper into environments (image volume of the
# server image at /opt/devenv). Needs the ImageVolume feature (Kubernetes
# 1.35+, on by default). MCP exec, background processes and search use it.
helper:
  enabled: true

# -- MCP endpoint (/mcp, Streamable HTTP) for AI agents. Users create their
# own access tokens in the console; tools act with that user's permissions.
mcp:
  enabled: true
  # -- Shared legacy token (single-user versions). It acts as legacyTokenUser.
  # Set false once every agent uses a personal token.
  legacyToken: true
  legacyTokenUser: ""
  # -- Existing Secret with key `token` used as the legacy token. When empty
  # a token is generated in the `<release>-keys` Secret (key `mcp-token`).
  existingSecret: ""

# -- Set the Secure flag on cookies. Enable when served over HTTPS.
secureCookies: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

logLevel: info
extraArgs: []
extraEnv: []
