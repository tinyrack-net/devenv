{{- if and (eq .Values.auth.mode "password") (not .Values.auth.existingSecret) }}
{{- $name := include "devenv.authSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "devenv.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ include "devenv.persistedRandom" (list . $name "password" 24) }}
{{- end }}
