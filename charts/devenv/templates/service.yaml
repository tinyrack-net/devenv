apiVersion: v1
kind: Service
metadata:
  name: {{ include "devenv.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devenv.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "devenv.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.sshService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devenv.fullname" . }}-ssh
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devenv.labels" . | nindent 4 }}
    {{- with .Values.sshService.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.sshService.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.sshService.type }}
  {{- with .Values.sshService.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  selector: {{- include "devenv.selectorLabels" . | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.sshService.port }}
      targetPort: ssh
      {{- if and (eq .Values.sshService.type "NodePort") .Values.sshService.nodePort }}
      nodePort: {{ .Values.sshService.nodePort }}
      {{- end }}
{{- end }}
