apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devenv.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "devenv.labels" . | nindent 4 }}
spec:
  {{- $sqlite := eq .Values.database.driver "sqlite" }}
  replicas: {{ if $sqlite }}1{{ else }}{{ .Values.replicaCount }}{{ end }}
  {{- if $sqlite }}
  # One writer for the SQLite file.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "devenv.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devenv.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "devenv.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devenv
          image: {{ include "devenv.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/devenv/devenv.yaml
            - --environment-namespace={{ .Values.environments.namespace }}
            - --leader-elect={{ and (not $sqlite) (gt (int .Values.replicaCount) 1) }}
            - --zap-log-level={{ .Values.logLevel }}
            {{- range .Values.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEVENV_HTTP_ADDR
              value: ":8080"
            - name: DEVENV_SSH_ADDR
              value: {{ if .Values.sshService.enabled }}":2222"{{ else }}""{{ end }}
            - name: DEVENV_SSH_PUBLIC_HOST
              value: {{ .Values.sshService.publicHost | quote }}
            - name: DEVENV_SSH_PUBLIC_PORT
              value: {{ .Values.sshService.publicPort | default (ternary .Values.sshService.nodePort .Values.sshService.port (and (eq .Values.sshService.type "NodePort") (not (empty .Values.sshService.nodePort)))) | quote }}
            - name: DEVENV_KEYS_SECRET
              value: {{ include "devenv.fullname" . }}-keys
            # The server image also carries devenv-agent; environments mount
            # it read-only at /opt/devenv (image volume).
            - name: DEVENV_HELPER_IMAGE
              value: {{ if .Values.helper.enabled }}{{ include "devenv.image" . | quote }}{{ else }}""{{ end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: ssh
              containerPort: 2222
            - name: metrics
              containerPort: 8081
            - name: probes
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          volumeMounts:
            - name: config
              mountPath: /etc/devenv/devenv.yaml
              subPath: devenv.yaml
              readOnly: true
            {{- if $sqlite }}
            - name: data
              mountPath: /var/lib/devenv
            {{- else if .Values.database.postgres.existingSecret }}
            - name: database
              mountPath: /etc/devenv/secrets/database
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.auth.mode "password") .Values.auth.passwordLogin }}
            - name: admin-password
              mountPath: /etc/devenv/secrets/admin
              readOnly: true
            {{- end }}
            {{- if .Values.mcp.existingSecret }}
            - name: mcp-token
              mountPath: /etc/devenv/secrets/mcp
              readOnly: true
            {{- end }}
            {{- range .Values.auth.oidc }}
            {{- if .existingSecret }}
            - name: oidc-{{ .id }}
              mountPath: /etc/devenv/secrets/oidc-{{ .id }}
              readOnly: true
            {{- end }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "devenv.fullname" . }}-config
        {{- if $sqlite }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.database.sqlite.existingClaim | default (printf "%s-data" (include "devenv.fullname" .)) }}
        {{- else if .Values.database.postgres.existingSecret }}
        - name: database
          secret:
            secretName: {{ .Values.database.postgres.existingSecret }}
            items: [{key: {{ .Values.database.postgres.secretKey }}, path: url}]
        {{- end }}
        {{- if and (eq .Values.auth.mode "password") .Values.auth.passwordLogin }}
        - name: admin-password
          secret:
            secretName: {{ include "devenv.authSecretName" . }}
            items: [{key: password, path: password}]
        {{- end }}
        {{- with .Values.mcp.existingSecret }}
        - name: mcp-token
          secret:
            secretName: {{ . }}
            items: [{key: token, path: token}]
        {{- end }}
        {{- range .Values.auth.oidc }}
        {{- if .existingSecret }}
        - name: oidc-{{ .id }}
          secret:
            secretName: {{ .existingSecret }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
