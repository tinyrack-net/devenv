# Minimal setup that works on any cluster: default StorageClass + SSH gateway.
apiVersion: devenv.tinyrack.net/v1alpha1
kind: DevEnvironmentClass
metadata:
  name: default
spec:
  storage:
    mode: persistent
    defaultSize: 10Gi
  network:
    mode: gateway
  limits:
    maxCPU: "8"
    maxMemory: 16Gi
    maxDisk: 100Gi
---
apiVersion: devenv.tinyrack.net/v1alpha1
kind: DevImage
metadata:
  name: base
spec:
  image: ghcr.io/tinyrack-net/devenv-base:latest
  displayName: Ubuntu (CLI)
  defaultResources:
    cpu: "2"
    memory: 4Gi
---
apiVersion: devenv.tinyrack.net/v1alpha1
kind: DevImage
metadata:
  name: desktop
spec:
  image: ghcr.io/tinyrack-net/devenv-desktop:latest
  displayName: Ubuntu + XFCE
  desktop: true
  defaultResources:
    cpu: "4"
    memory: 8Gi
---
apiVersion: devenv.tinyrack.net/v1alpha1
kind: DevEnvironment
metadata:
  name: sample
  namespace: devenv
spec:
  imageRef: base
  resources:
    cpu: "2"
    memory: 4Gi
    disk: 20Gi
  sshAuthorizedKeys:
    - ssh-ed25519 AAAA... you@example
