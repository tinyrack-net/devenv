---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devenv
rules:
- apiGroups:
  - ""
  resources:
  - events
  - resourcequotas
  verbs:
  - list
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - devenv.tinyrack.net
  resources:
  - devenvironmentclasses
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - devenv.tinyrack.net
  resources:
  - devenvironments
  - devimages
  - devusers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - devenv.tinyrack.net
  resources:
  - devenvironments/status
  - devusers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
