              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DevUserSpec defines a console user.
            properties:
              disabled:
                description: Disabled users can not sign in and their tokens and keys
